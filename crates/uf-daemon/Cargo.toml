[package]
name = "uf-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "uf-daemon"
path = "src/main.rs"

[features]
default = []
# Historical simulator recovery is never part of the ordinary daemon entry.
experimental-reconciliation = []

[dependencies]
libc = "0.2"
serde = "=1.0.228"
serde_json = "=1.0.149"
uf-acl-sys = { path = "../uf-acl-sys" }
uf-core = { path = "../uf-core" }
uf-ub-sim-agent = { path = "../uf-ub-sim-agent" }
